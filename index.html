<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e9f7ee">
  <title>Canvaseeds | 学年アンケート</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#254b3a;background:#f2faf6}*{box-sizing:border-box}body{margin:0;padding:24px 14px}.card{max-width:480px;margin:0 auto;background:#fff;border-radius:22px;padding:28px 22px;box-shadow:0 8px 30px #285f4912}.logo{text-align:center;font-size:34px}h1{text-align:center;font-size:24px;color:#285f49;margin:5px 0}h2{font-size:19px;margin:26px 0 8px}.subtitle{text-align:center;color:#547a68;font-size:14px}p{line-height:1.7}.hint{color:#60786b;font-size:14px}.option{display:flex;gap:12px;align-items:center;padding:15px;border:1px solid #dfeae3;border-radius:12px;margin:9px 0;cursor:pointer}.option:has(input:checked){background:#e9f7ee;border-color:#73ba96}.option input{accent-color:#378b65;width:19px;height:19px}.privacy{font-size:12px;background:#e4f4ea;border-radius:10px;padding:13px;line-height:1.7;margin:18px 0}button{width:100%;border:0;border-radius:12px;padding:16px;background:#378b65;color:white;font-weight:700;font-size:16px;cursor:pointer}button:disabled{background:#a6c6b5;cursor:not-allowed}#status{font-size:14px;min-height:1.5em;text-align:center}footer{text-align:center;font-size:12px;color:#6c8176;margin-top:18px}
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<main class="card">
  <div class="logo">🌱</div>
  <h1>Canvaseeds</h1>
  <p class="subtitle">あなたにぴったりのイベント情報を</p>
  <p id="liff-status" role="status" aria-live="polite">
  LINEとの接続を確認中...
</p>
  <form id="survey">
    <h2>お子さまの学年を教えてください</h2>
    <p class="hint">兄弟姉妹がいる場合は、当てはまるものをすべて選んでください。</p>
    <div id="options"></div>
    <div class="privacy">回答はイベント案内・集計のために使用する予定です。お子さまのお名前や生年月日は取得しません。現在は画面確認用のデモです。</div>
    <button id="submit" type="submit" disabled>回答内容を確認する</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
  <footer>Canvaseeds 学年アンケート（デモ）</footer>
</main>
<script>
  const labels=['未就学児','小学1〜2年生','小学3〜4年生','小学5〜6年生','中学生','高校生','その他・該当なし'];
  const tags=['grade_preschool','grade_elem12','grade_elem34','grade_elem56','grade_junior','grade_senior','grade_none'];
  const options=document.querySelector('#options');
  labels.forEach((label,i)=>{
    const wrapper=document.createElement('label');wrapper.className='option';
    const input=document.createElement('input');input.type='checkbox';input.value=tags[i];input.name='grade';
    const span=document.createElement('span');span.textContent=label;
    wrapper.append(input,span);options.append(wrapper);
  });
  const inputs=[...document.querySelectorAll('input[name=grade]')];
  const submit=document.querySelector('#submit');
  inputs.forEach(input=>input.addEventListener('change',()=>{
    if(input.checked){
      if(input.value==='grade_none')inputs.filter(x=>x!==input).forEach(x=>x.checked=false);
      else inputs.find(x=>x.value==='grade_none').checked=false;
    }
    submit.disabled=!inputs.some(x=>x.checked);
    document.querySelector('#status').textContent='';
  }));
  document.querySelector('#survey').addEventListener('submit',e=>{
    e.preventDefault();
    const selected=inputs.filter(x=>x.checked);
    document.querySelector('#status').textContent='選択内容：'+selected.map(x=>labels[tags.indexOf(x.value)]).join('、')+'（デモのため保存・送信されません）';
  });
</script>
 
<script>
  const LIFF_ID = "2012227961-Fomc1PKF";

  const API_URL = "https://canvaseeds-liff-api-gngvfke7d3ceawax.japanwest-01.azurewebsites.net/api/verify-line";

  async function initializeLiff() {
    const status = document.getElementById("liff-status");

    try {
      await liff.init({ liffId: LIFF_ID });

      if (!liff.isLoggedIn()) {
        status.textContent = "LINEログイン画面に移動します";
        liff.login();
        return;
      }

      const idToken = liff.getIDToken();

      if (!idToken) {
        throw new Error("IDトークンを取得できませんでした");
      }

      status.textContent = "LINEの本人確認中...";

      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          idToken: idToken
        })
      });

      if (!response.ok) {
        throw new Error(
          "Azureでの認証に失敗しました（HTTP " +
          response.status + "）"
        );
      }

      const result = await response.json();

      if (result.verified !== true || !result.lineUserId) {
        throw new Error("認証結果が正しくありません");
      }

      status.textContent = "LINEの本人確認に成功しました！";
      console.log("LINE認証成功");

    } catch (error) {
      console.error("LINE認証エラー:", error);
      status.textContent =
        "LINEとの接続に失敗しました: " + error.message;
    }
  }

  initializeLiff();
</script>
</body>
</html>
